name: Build Pantry Keeper

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APKs and App Bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform project
        run: flutter create --platforms=android --org com.py963963yp --project-name pantry_keeper .
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart sources
        run: dart format lib test
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build architecture-specific APKs
        run: flutter build apk --release --split-per-abi
      - name: Build Android App Bundle
        run: flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: pantry-keeper-android
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate iOS platform project
        run: flutter create --platforms=ios --org com.py963963yp --project-name pantry_keeper .
      - name: Install dependencies
        run: flutter pub get
      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: pantry-keeper-ios-unsigned
          path: build/ios/iphoneos/Runner.app
          if-no-files-found: error
